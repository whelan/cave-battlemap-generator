[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cave-battlemap-generator"
version = "0.1.0"
description = "Hand-drawn cave battlemaps from a small YAML spec: painted map, Foundry walls and lights, Dungeondraft export"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "pillow>=10.1", "pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
cave-map = "cavemap.render:main"
cave-dd = "cavemap.dd:main"

[tool.setuptools]
packages = ["cavemap"]

[tool.setuptools.package-data]
cavemap = ["dd_template.json"]
